# Name your project! Project names should contain only lowercase characters
# and underscores.
name: VS_dbt_pipeline
version: '1.0.0'
config-version: 2

# File path configurations
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# -------------------------
# Global Variables
# -------------------------


# This tells dbt which profile to use.
profile: VS_dbt_pipeline

# -------------------------
# Model Configurations
# -------------------------


models:
  VS_dbt_pipeline:

    staging:
      schema: "staging"
      +materialized: table

    intermediate:
      schema: "intermediate"
      +materialized: table
     
    final:
      schema: "final"
      +materialized: table

    raw:
      schema: "raw"
      +materialized: table
  

